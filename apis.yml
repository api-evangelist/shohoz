aid: shohoz
name: Shohoz
description: >-
  Shohoz (Shohoj Limited) is a Bangladeshi consumer technology platform and
  digital super-app, billed as Bangladesh's largest online ticket destination.
  Founded in 2014 as an online ticketing service, it lets users book bus, train,
  air, launch (ferry), event, and movie tickets from its website and mobile
  apps, and expanded into ride-hailing (car and motorbike), on-demand delivery,
  and other everyday services. The company reports 10M+ users, 250M+ tickets
  sold, and 1,000+ transport and merchant partners across 3,000+ routes. Shohoz
  is a technology-first business but does not publish a public developer program,
  API reference, SDKs, or documentation surface; this profile captures its public
  identity and domain-security posture for the API Evangelist network.
